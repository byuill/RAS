    parameters: {usgs_dv_discharge: [], usgs_wqp_samples: []}
    notes: Red River contributes to Atchafalaya flow. Simmesport minus Alexandria is not automatically treated as Old River diversion; routing/storage and remaining inflows must be accounted for.
