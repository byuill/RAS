    name: Ohio River at Metropolis, IL
    short_name: Ohio at Metropolis
    river: Ohio
    parameters: {usgs_dv_discharge: [], usgs_wqp_samples: []}
    notes: Major input at the Ohio-Mississippi confluence. Do not use a Middle Mississippi gage below the confluence without Ohio inflow and routing.
