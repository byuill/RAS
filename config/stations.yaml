    parameters: {usgs_dv_discharge: [], usgs_wqp_samples: []}
    notes: Mandatory inflow term for the Vicksburg-to-Natchez/Union Point proxy. Gage-to-mouth travel, lower ungaged inflow and storage are not resolved by same-day sums.
