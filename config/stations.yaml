# Observation station catalog.
# Values below were verified on 2026-10-07 against the USGS NWIS site service / series catalog
# (waterservices.usgs.gov/nwis/site) and the USACE CWMS Data API.  Nothing here is a model result.
#
# Add stations by appending to this list, or place additional entries in stations_user.yaml
# (same schema; same id overrides the entry here).
#
# parameter keys (see observations/providers.py):
#   usgs_dv_discharge  USGS daily mean discharge (00060, cfs)
#   usgs_dv_stage      USGS daily mean gage height (00065, ft above gage zero)
#   usgs_dv_ssc        USGS daily suspended-sediment concentration (80154, mg/L)
#   usgs_dv_ssl        USGS daily suspended-sediment discharge (80155, short tons/day)
#   usgs_wqp_samples   USGS discrete samples via Water Quality Portal (80154, 80155, 70331 %<0.0625mm, 00061/00060, 00065, 00010)
#   cwms_flow / cwms_stage   USACE CWMS time series named in the `cwms` block
#
# gage_zero_elev_ft / gage_zero_datum: elevation of gage zero (USGS site header).  Stage elevation
# (= gage height + zero [+ shift]) is only computed when the datum is NAVD88, or when
# ngvd29_to_navd88_shift_ft is supplied for NGVD29 gages.
# legacy_ras_station: the LMR river station used for this gage in the earlier RAS_Sed_Viewer.py
# (hint only; the application maps stations geospatially and stores overrides in station_mappings.json).

